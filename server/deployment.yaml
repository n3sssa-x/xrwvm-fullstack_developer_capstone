apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    run: dealership
  name: dealership
spec:
  replicas: 1
  selector:
    matchLabels:
      run: dealership
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        run: dealership
    spec:
      containers:
      - image: us.icr.io/your-name-space/dealership:latest
        imagePullPolicy: Always
        name: dealership
        ports:
        - containerPort: 8000
          protocol: TCP
        env:
        - name: DJANGO_SETTINGS_MODULE
          value: "djangoproj.settings"
        # You can override backend_url & sentiment_analyzer_url via env vars or a ConfigMap
        - name: BACKEND_URL
          value: "http://localhost:3030"
        - name: SENTIMENT_ANALYZER_URL
          value: "http://localhost:5050/"
      restartPolicy: Always

---

apiVersion: v1
kind: Service
metadata:
  name: dealership-service
spec:
  selector:
    run: dealership
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
  type: ClusterIP
